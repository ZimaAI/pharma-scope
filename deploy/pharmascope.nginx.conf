# PharmaScope Lite reverse proxy and static frontend.
# Install as /etc/nginx/sites-available/pharmascope and enable it.

server {
    listen 80;
    listen [::]:80;
    server_name pharmascope.zimagent.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pharmascope-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://pharmascope.zimagent.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pharmascope.zimagent.top;

    root /var/www/pharmascope/current;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/pharmascope.zimagent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharmascope.zimagent.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/pharmascope.access.log;
    error_log /var/log/nginx/pharmascope.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
