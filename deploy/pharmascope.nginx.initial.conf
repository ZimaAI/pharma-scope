# Temporary HTTP-only config used only while obtaining the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name pharmascope.zimagent.top;

    root /var/www/pharmascope/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pharmascope-acme;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
