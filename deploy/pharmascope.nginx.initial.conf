# Temporary HTTP-only config used only while obtaining the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name pharmascope.zimagent.top;

    root /var/www/pharmascope/current;
    index index.html;
    client_max_body_size 1m;
    access_log /var/log/nginx/pharmascope.access.log;
    error_log /var/log/nginx/pharmascope.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pharmascope-acme;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 90s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Accel-Buffering no always;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Accel-Buffering no always;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
