<script>
'use strict';
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>Array.from(r.querySelectorAll(q));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const pill=(s,c='')=>`<span class="pill ${c}">${esc(s)}</span>`;
const btn=(s,action,primary=false,more='')=>`<button class="btn ${primary?'primary':''}" data-action="${action}" ${more}>${s}</button>`;
const nav=(route)=>{location.hash=route;$('#sidebar').classList.remove('open');closeOverlay();};
const STORAGE='pharmascope-lite-prototype-v1';
const seed={role:'analyst',scenario:'normal',drugs:[

{id:'PX-202',name:'PX-202',desc:'示例研发项目 Beta',indication:'演示适应证 B',target:'示例靶点 B',aliases:2,updated:'09-17 10:15'},
{id:'PX-303',name:'PX-303',desc:'示例研发项目 Gamma',indication:'演示适应证 C',target:'示例靶点 C',aliases:2,updated:'09-17 09:40'},
{id:'PX-404',name:'PX-404',desc:'示例研发项目 Delta',indication:'演示适应证 A',target:'示例靶点 D',aliases:1,updated:'09-16 12:30'},
{id:'PX-505',name:'PX-505',desc:'示例研发项目 Epsilon',indication:'演示适应证 D',target:'示例靶点 E',aliases:2,updated:'09-15 15:00'},
{id:'PX-606',name:'PX-606',desc:'示例研发项目 Zeta',indication:'演示适应证 E',target:'示例靶点 F',aliases:1,updated:'09-14 11:00'}],
trials:[
{id:'DEMO-CT-001',drug:'PX-101',title:'PX-101 在演示适应证 A 中的研究',phase:'PHASE2',status:'ACTIVE_NOT_RECRUITING',enroll:160,enrollType:'ESTIMATED',date:'2026-09-16',changed:true},
{id:'DEMO-CT-002',drug:'PX-202',title:'PX-202 的示例早期研究登记',phase:'PHASE1',status:'RECRUITING',enroll:48,enrollType:'ESTIMATED',date:'2026-09-17',changed:true},
{id:'DEMO-CT-003',drug:'PX-303',title:'PX-303 演示队列观察记录',phase:'PHASE2',status:'RECRUITING',enroll:96,enrollType:'ESTIMATED',date:'2026-09-17',changed:false},
{id:'DEMO-CT-004',drug:'PX-404',title:'PX-404 在演示适应证 A 中的研究',phase:'PHASE1',status:'NOT_YET_RECRUITING',enroll:32,enrollType:'ESTIMATED',date:'2026-09-16',changed:false},
{id:'DEMO-CT-005',drug:'PX-505',title:'PX-505 模拟研究结果登记',phase:'PHASE2',status:'COMPLETED',enroll:84,enrollType:'ACTUAL',date:'2026-09-15',changed:false},
{id:'DEMO-CT-006',drug:'PX-606',title:'PX-606 研究方案登记示例',phase:'PHASE1',status:'RECRUITING',enroll:40,enrollType:'ESTIMATED',date:'2026-09-14',changed:false},
{id:'DEMO-CT-007',drug:'PX-101',title:'PX-101 延伸观察研究示例',phase:'PHASE2',status:'RECRUITING',enroll:72,enrollType:'ESTIMATED',date:'2026-09-14',changed:false},
{id:'DEMO-CT-008',drug:'PX-202',title:'PX-202 后续队列研究示例',phase:'PHASE2',status:'NOT_YET_RECRUITING',enroll:120,enrollType:'ESTIMATED',date:'2026-09-14',changed:false}],

{id:'EV-02',drug:'PX-101',trial:'DEMO-CT-001',title:'招募状态更新',field:'overallStatus',before:'RECRUITING',after:'ACTIVE_NOT_RECRUITING',type:'招募状态',date:'09-16 16:00',level:'重要',note:'只描述登记状态变化，不代表试验完成或药物有效。'},

{id:'REP-002',title:'PX-202 公开资料覆盖与研究缺口',drug:'PX-202',status:'draft',version:1,date:'09-17 11:00',cutoff:'2026-09-17 03:00 UTC'},

subscriptions:[{id:'SUB-1',name:'PX-101 研究进展周报',drug:'PX-101',frequency:'每周一 09:00',enabled:true},{id:'SUB-2',name:'PX-202 登记变化日报',drug:'PX-202',frequency:'每天 18:00',enabled:false}],
runs:[],inbox:[{title:'PX-101 简报等待人工审核',text:'模拟通知 · REP-001 / v1',read:false}],fault:false,reviewed:false};
let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||structuredClone(seed);}catch(e){state=JSON.parse(JSON.stringify(seed));}

let route='',filter='',tableStatus='all',reportTab='all',pendingSearch=null,diffMode='enrollment',timer=null,activeRun=null,lastFocus=null;

// Mock boundary: replace these calls with a typed API client in the production frontend.
const mockApi={
 drugs:()=>state.drugs.filter(d=>(d.name+' '+d.desc+' '+d.indication).toLowerCase().includes(filter.toLowerCase())),

 createRun:(question,drug)=>{const r={id:'RUN-'+String(state.runs.length+1).padStart(3,'0'),question,drug,status:'queued',step:0,events:[],fault:state.fault};state.runs.unshift(r);save();return r;},
 approveReport:(id)=>{let r=state.reports.find(x=>x.id===id);if(state.role!=='reviewer'||!state.reviewed||r?.status!=='in_review')return {ok:false,message:'需要独立审核员核对当前版本后批准。'};r.status='approved';save();return {ok:true};},
 publishReport:(id)=>{let r=state.reports.find(x=>x.id===id);if(state.role!=='reviewer'||r.status!=='approved')return false;r.status='published';state.inbox.unshift({title:r.title+' 已发布',text:'模拟站内交付 · '+r.id,read:false});save();return true;}
};
const labels={dashboard:'情报概览',drugs:'药物档案',trials:'临床试验',changes:'变化追踪',literature:'文献情报',research:'Agent 研究',reports:'报告与审核',subscriptions:'订阅管理',settings:'来源与设置'};
const icons={dashboard:'grid',drugs:'drug',trials:'trial',changes:'pulse',literature:'book',research:'spark',reports:'file',subscriptions:'bell',settings:'settings'};
const stLabel={RECRUITING:'招募中',ACTIVE_NOT_RECRUITING:'活跃，未招募',NOT_YET_RECRUITING:'尚未招募',COMPLETED:'已完成（来源状态）',in_review:'待审核',draft:'草稿',approved:'已批准',published:'已发布',changes_requested:'需修改',queued:'排队中',running:'研究中',completed:'已完成',partial:'部分完成',cancelled:'已取消'};
const stColor={RECRUITING:'blue',ACTIVE_NOT_RECRUITING:'purple',NOT_YET_RECRUITING:'',COMPLETED:'',in_review:'amber',draft:'',approved:'green',published:'green',changes_requested:'red',queued:'',running:'blue',completed:'green',partial:'amber',cancelled:''};
const status=s=>pill(stLabel[s]||s,stColor[s]||'');
function toast(msg){$('#toast-root').innerHTML=`<div class="toast">${I('info')} ${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',3500);}
function shell(){const page=route.split('/')[0]||'dashboard';$('#sidebar').innerHTML=`<div class="brand"><div class="brand-logo">${I('pulse')}</div><div class="brand-text"><div class="brand-name">PharmaScope<span>LITE</span></div><div class="brand-sub">RESEARCH INTELLIGENCE</div></div></div><div class="workspace"><small>当前工作区 · 演示</small><strong>研发情报实验室</strong></div><div class="nav-label">INTELLIGENCE</div>${['dashboard','drugs','trials','changes','literature'].map(n=>`<button class="nav-link ${page===n?'active':''}" data-nav="${n}" aria-label="${labels[n]}">${I(icons[n])}<span>${labels[n]}</span>${n==='changes'?'<span class="count">3</span>':''}</button>`).join('')}<div class="nav-label">RESEARCH & DELIVERY</div>${['research','reports','subscriptions'].map(n=>`<button class="nav-link ${page===n?'active':''}" data-nav="${n}" aria-label="${labels[n]}">${I(icons[n])}<span>${labels[n]}</span></button>`).join('')}<div class="sidebar-bottom"><div class="lite-card"><strong>${I('server')} 4 核 · 8 GB 设计基线</strong>单研究槽 / 外部模型 API<br>原型不运行模型或后端</div><button class="nav-link ${page==='settings'?'active':''}" data-nav="settings" aria-label="来源与设置">${I('settings')}<span>来源与设置</span></button><div class="user"><div class="avatar">${state.role==='analyst'?'析':'审'}</div><div class="meta">演示${state.role==='analyst'?'分析员':'审核员'}<small>角色切换仅用于原型</small></div></div></div>`;
$('#topbar').innerHTML=`<div class="row"><button class="btn ghost square mobile-menu" data-action="menu" aria-label="打开导航">${I('menu')}</button><div class="crumb">工作区 <span style="margin:0 10px">/</span> <b>${labels[page]||'详情'}</b></div></div><div class="row"><div class="search-global">${I('search')}<input aria-label="全局搜索药物" id="global-search" placeholder="搜索药物、研发代号…"><span class="keycap">↵</span></div><select class="role-select" id="role-select" aria-label="切换演示角色"><option value="analyst" ${state.role==='analyst'?'selected':''}>演示 · 分析员</option><option value="reviewer" ${state.role==='reviewer'?'selected':''}>演示 · 审核员</option></select><button class="btn ghost square" data-action="inbox" aria-label="查看模拟通知">${I('bell')}</button><button class="btn primary" data-action="new-run">${I('plus')}<span class="new-label">创建研究</span></button></div>`;
}
function pageHeader(title,sub,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions row">${actions}</div></div>`;}
function modebar(){return `<div class="modebar"><span><b>DEMO · 交互原型</b><span class="full-mode">　所有药物、试验、计数与研究进度均为虚构；未连接模型和官方数据源。</span></span><div class="row" style="gap:5px"><span class="full-mode">查看页面状态</span><select class="scene" id="scene" aria-label="切换页面状态">${[['normal','正常'],['loading','加载中'],['empty','空状态'],['error','请求失败'],['denied','无权限']].map(([v,t])=>`<option value="${v}" ${state.scenario===v?'selected':''}>${t}</option>`).join('')}</select></div></div>`;}
function render(){route=location.hash.slice(1)||'dashboard';shell();let [page,id]=route.split('/');let body='';if(state.scenario!=='normal'){body=pageHeader(labels[page]||'工作台','组件状态演示，不代表真实来源或权限变化。');if(state.scenario==='loading'){body+='<div class="card"><div class="skeleton"></div><div class="skeleton line"></div><div class="skeleton line"></div></div>';}else{const msg={empty:['暂无资料','先建立关注药物并同步来源。筛选无结果与尚未同步需要分开呈现。'],error:['来源请求未完成','当前是错误界面演示。请求失败不能解释为“没有临床试验变化”。'],denied:['没有访问此页面的权限','原型状态演示；正式系统需要由服务端验证角色与工作区。']}[state.scenario];body+=`<div class="card empty">${I(state.scenario==='denied'?'shield':'info')}<h2>${msg[0]}</h2><p>${msg[1]}</p>${btn('返回正常演示','normal',true)}</div>`;}}else{body=({dashboard,drugs:()=>id?drugDetail(id):drugs(),trials:()=>id?trialDetail(id):trials(),changes:()=>id?changeDetail(id):changes(),literature,research:()=>research(id),reports:()=>id?reportDetail(id):reports(),subscriptions,settings}[page]||dashboard)();}
$('#main').innerHTML=modebar()+body+'<div class="footer-note">PharmaScope Lite · 产品原型 v1.0 · 仅辅助公开研发信息研究，不用于诊疗或用药决策</div>';save();}
function dashboard(){return pageHeader('每一次进展，都有证据可循。','关注药物、追踪登记变化，让研究结论回到原始资料。',btn(I('clock')+' 演示周期 09.14 — 09.18','period'))+`<div class="stats">${[[state.drugs.length,'关注药物','当前演示工作区','drug'],[state.trials.length,'跟踪试验','公开登记数据结构示例','trial'],[state.changes.filter(c=>c.type!=='建立基线').length,'已记录字段变化','不包含首次建立基线','pulse'],[state.reports.filter(r=>r.status==='in_review').length,'等待人工审核','批准与发布独立进行','shield']].map(([v,l,n,i])=>`<div class="card stat"><div class="row between"><span class="label">${l}</span><span class="stat-icon">${I(i)}</span></div><div class="value">${v.toString().padStart(2,'0')}</div><small>${n}</small></div>`).join('')}</div><div class="grid2"><div class="stack"><div class="card hero"><div class="section-label" style="color:#6681C3">YOUR RESEARCH COPILOT</div><div class="hero-decoration">${I('spark')}</div><h2>从一个问题，到一份可审核的研究简报</h2><p>Agent 在受控来源中自主检索、读取和补查；每条结论关联证据，<br>资料不足时明确保留缺口，而不是补成确定答案。</p><div class="ask"><span>整理 PX-101 的登记变化，说明证据与资料缺口…</span>${btn(I('spark')+' 发起研究','new-run',true)}</div><div class="hero-foot"><span>◈ GPT Researcher 二开</span><span>◈ 单研究槽</span><span>◈ 全程证据追溯</span></div></div><div class="card"><div class="card-head"><div class="row"><h2>近期登记变化</h2>${pill('模拟观察','outline')}</div><button class="btn link" data-nav="changes">查看全部 ${I('right')}</button></div>${changesTable(state.changes.filter(c=>c.type!=='建立基线').slice(0,3),true)}<div class="table-foot"><span>按系统观察时间展示，不代表实际临床事件发生时间</span></div></div><div class="card"><div class="card-head"><h2>关注药物</h2><button class="btn link" data-nav="drugs">管理档案 ${I('right')}</button></div><div class="grid-even pad">${state.drugs.slice(0,4).map(d=>`<div class="row between"><div class="name-cell"><div class="drug-badge">${I('drug')}</div><div><button class="btn link" data-nav="drugs/${d.id}">${esc(d.name)}</button><small>${esc(d.indication)}</small></div></div><span class="small">${state.trials.filter(t=>t.drug===d.id).length} 项试验</span></div>`).join('')}</div></div></div><div class="stack"><div class="card"><div class="card-head"><h2>待办与审核</h2>${pill('人工把关','purple')}</div><div class="pad">${state.reports.filter(r=>r.status!=='published').slice(0,3).map(r=>`<div class="review-item"><div class="review-marker">${I('file')}</div><div style="min-width:0"><p>${esc(r.title)}</p><div class="row wrap" style="gap:7px;margin-top:6px">${status(r.status)}<small>v${r.version} · ${r.date}</small></div><button class="btn link" style="font-size:11px;margin-top:4px" data-nav="reports/${r.id}">打开报告 ${I('arrow')}</button></div></div>`).join('')}</div></div><div class="card"><div class="card-head"><h2>资料来源</h2><button class="btn ghost tiny" data-nav="settings">${I('settings')}</button></div><div class="pad"><div class="source-row"><div><strong>ClinicalTrials.gov</strong><small style="display:block">登记结构化信息</small></div>${pill('离线样例','blue')}</div><div class="source-row"><div><strong>PubMed</strong><small style="display:block">文献元数据 / 摘要</small></div>${pill('离线样例','blue')}</div><div class="callout mt">所有资料来自本地演示数据。正式版将通过受控适配器获取公开信息。</div></div></div><div class="card pad"><div class="row between"><h3>轻量运行策略</h3>${I('server')}</div><div class="metric-inline" style="margin-top:14px"><div><strong>1</strong><span>研究执行槽</span></div><div><strong>2</strong><span>来源请求并发</span></div></div><div class="divider"></div><small>这是部署设计约束，不是服务器实测监控。</small></div></div></div>`;}
function changesTable(items,compact=false){return `<div class="table-wrap"><table><thead><tr><th>药物 / 变化</th>${compact?'':'<th>试验标识</th>'}<th>前后值</th><th>系统发现</th><th></th></tr></thead><tbody>${items.map(c=>`<tr><td><div><strong>${c.drug}</strong> ${pill(c.type,c.level==='更正'?'amber':'blue')}</div><small>${c.title}</small></td>${compact?'':`<td class="mono">${c.trial}</td>`}<td><span class="value-before">${c.before.length>12?c.before.slice(0,11)+'…':c.before}</span><span class="arrow">→</span><span class="value-after">${c.after.length>12?c.after.slice(0,11)+'…':c.after}</span></td><td class="nowrap small">${c.date}</td><td><button class="btn link" data-nav="changes/${c.id}">${compact?'查看':'查看差异'}</button></td></tr>`).join('')}</tbody></table></div>`;}
function drugs(){let ds=mockApi.drugs();return pageHeader('药物档案','围绕明确的研发对象组织试验、文献与研究任务。',btn(I('plus')+' 建立药物档案','new-drug',true))+`<div class="card"><div class="filterbar"><input class="input search" id="table-search" aria-label="筛选药物" placeholder="搜索名称、研发代号、适应证…" value="${esc(filter)}">${pill(ds.length+' 个档案','outline')}<button class="btn tiny ghost" data-action="clear-filter">清除筛选</button></div><div class="table-wrap"><table><thead><tr><th>药物 / 研发代号</th><th>研究标签</th><th>别名</th><th>关联试验</th><th>最近观察</th><th>操作</th></tr></thead><tbody>${ds.map(d=>`<tr><td><div class="name-cell"><div class="drug-badge">${I('drug')}</div><div><strong>${esc(d.name)}</strong><small>${esc(d.desc)}</small></div></div></td><td><div>${esc(d.indication)}</div><small>${esc(d.target)} · 演示标签</small></td><td>${d.aliases} 个</td><td>${state.trials.filter(t=>t.drug===d.id).length} 项</td><td class="small nowrap">${d.updated}</td><td><button class="btn link" data-nav="drugs/${d.id}">查看档案 ${I('right')}</button></td></tr>`).join('')}</tbody></table></div>${ds.length?'':`<div class="empty"><h3>筛选无结果</h3><p>没有符合当前关键词的药物。</p></div>`}<div class="table-foot"><span>共 ${ds.length} 个虚构药物 · 研究标签不是获批适应证</span><span>第 1 页</span></div></div>`;}
function drugDetail(id){const d=state.drugs.find(d=>d.id===id)||state.drugs[0];const ts=state.trials.filter(t=>t.drug===d.id);return `<button class="breadcrumb-back" data-nav="drugs">← 返回药物档案</button>`+pageHeader(`<span class="detail-title"><span class="drug-badge">${I('drug')}</span>${esc(d.name)} ${pill('虚构研发对象','blue')}</span>`,esc(d.desc)+' · 别名与关联需要人工确认',btn(I('spark')+' 研究此药物','new-run:'+d.id,true))+`<div class="grid2"><div class="stack"><div class="card pad"><h2>对象概览</h2><dl class="kv mt"><dt>研发代号</dt><dd>${d.id}</dd><dt>研究标签</dt><dd>${esc(d.indication)} / ${esc(d.target)}（演示）</dd><dt>资料范围</dt><dd>ClinicalTrials.gov + PubMed</dd><dt>实体关联</dt><dd>${ts.length} 项试验 · 人工确认的样例关联</dd></dl><div class="callout amber mt">药物标签仅用于组织研究；本平台不据此推断机制、疗效或监管批准。</div></div><div class="card"><div class="card-head"><h2>关联临床试验</h2>${pill(ts.length+' 项','outline')}</div>${trialsTable(ts)}</div><div class="card"><div class="card-head"><h2>最近研究</h2></div><div class="pad"><p class="secondary">从登记记录变化出发，补查相关文献并整理证据。</p><button class="btn link mt" data-nav="reports/REP-001">查看 PX-101 演示报告 ${I('arrow')}</button></div></div></div><div class="stack"><div class="card pad"><h2>别名与来源</h2><div class="source-row"><div><strong>${esc(d.name)}</strong><small style="display:block">标准展示名</small></div>${pill('已确认','green')}</div><div class="source-row"><div><strong>${d.name.replace('-','')}</strong><small style="display:block">研发代号变体</small></div>${pill('已确认','green')}</div><div class="callout mt">别名只在当前对象范围内使用。同名候选必须人工核对，不自动合并药物。</div></div><div class="card pad"><h3>关联依据</h3><p class="secondary small mt">每个试验关联独立保留来源与审核状态，可撤销但不删除历史快照。</p>${btn('查看关联证据','evidence:after',false,'style="margin-top:16px"')}</div></div></div>`;}
function trialsTable(ts){return `<div class="table-wrap"><table><thead><tr><th>试验登记</th><th>药物</th><th>阶段</th><th>招募状态</th><th>入组数量</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong class="mono">${t.id}</strong><small style="display:block;max-width:270px">${esc(t.title)}</small></td><td>${t.drug}</td><td class="small">${t.phase.replace('PHASE','Phase ')}</td><td>${status(t.status)}</td><td>${t.enroll} <small>${t.enrollType==='ACTUAL'?'实际':'目标'}</small></td><td><button class="btn link" data-nav="trials/${t.id}">详情 ${I('right')}</button></td></tr>`).join('')}</tbody></table></div>`;}
function trials(){const ts=mockApi.trials();return pageHeader('临床试验','保留原始登记信息、观察版本与字段含义，不将状态变化解读为临床结果。',btn(I('refresh')+' 模拟同步','sync',false))+`<div class="card"><div class="filterbar"><input class="input search" id="table-search" aria-label="筛选试验" value="${esc(filter)}" placeholder="搜索 DEMO 标识、药物或试验标题…"><select class="input" id="status-filter" aria-label="筛选招募状态"><option value="all">全部招募状态</option>${['RECRUITING','ACTIVE_NOT_RECRUITING','NOT_YET_RECRUITING','COMPLETED'].map(s=>`<option value="${s}" ${tableStatus===s?'selected':''}>${stLabel[s]}</option>`).join('')}</select></div>${trialsTable(ts)}<div class="table-foot"><span>${ts.length} 项虚构试验 · 来源更新时间与系统发现时间分别保存</span><button class="btn tiny" data-action="clear-filter">重置筛选</button></div></div>`;}
function baselineTrial(t){return `<button class="breadcrumb-back" data-nav="trials">← 返回临床试验</button>`+pageHeader(t.id,esc(t.title)+' · 虚构基线记录',btn('基于此对象研究','new-run:'+t.drug,true))+`<div class="grid2"><div class="card pad"><div class="row wrap">${status(t.status)}${pill(t.drug,'blue')}${pill('仅基线样例','outline')}</div><dl class="kv mt"><dt>试验标题</dt><dd>${esc(t.title)}</dd><dt>登记阶段</dt><dd>${t.phase}</dd><dt>人数</dt><dd>${t.enroll} · ${t.enrollType}</dd><dt>研究对象</dt><dd>${t.drug}</dd><dt>样例日期</dt><dd>${t.date}</dd><dt>实际变化发生</dt><dd>没有足够资料确认</dd></dl><div class="callout amber mt">该记录只有基线样例，没有前后快照，因此不显示虚构字段差异，也不引用其他药物的证据。</div></div><div class="card pad"><h2>观察记录</h2><p class="secondary mt">首次建立资料基线，不代表试验刚刚启动。</p><p class="small mt">本原型的完整字段差异与证据定位仅在 DEMO-CT-001 中演示。</p><button class="btn mt" data-nav="trials/DEMO-CT-001">查看完整差异演示</button></div></div>`;}
function trialDetail(id){const t=state.trials.find(x=>x.id===id)||state.trials[0];if(t.id!=='DEMO-CT-001')return baselineTrial(t);return `<button class="breadcrumb-back" data-nav="trials">← 返回临床试验</button>`+pageHeader(t.id,`${esc(t.title)} · 全部内容为演示数据`,btn(I('pulse')+' 查看版本差异','goto-change',true))+`<div class="row wrap" style="margin-bottom:18px">${status(t.status)}${pill(t.phase.replace('PHASE','Phase '),'outline')}${pill(t.drug,'blue')}<span class="small">历史切片截止 ${t.date} · 后续更正在变化中心查看</span></div><div class="grid2"><div class="stack"><div class="card"><div class="tabs"><button class="tab active">登记概览</button><button class="tab" data-nav="changes/EV-01">版本与变化</button><button class="tab" data-action="evidence:after">原始证据</button></div><div class="pad"><dl class="kv"><dt>登记标题</dt><dd>${esc(t.title)}</dd><dt>登记阶段</dt><dd>${t.phase}</dd><dt>招募状态</dt><dd>${t.status}</dd><dt>入组数量</dt><dd><strong>${t.enroll}</strong> 人 ${pill(t.enrollType,'outline')}<small style="display:block">${t.enrollType==='ACTUAL'?'来源明确标注实际值；不代表疗效。':'目标值，不等于已完成入组人数。'}</small></dd><dt>研究对象</dt><dd>${t.drug} / 演示适应证</dd><dt>申办者</dt><dd>虚构研究机构 · 仅用于原型</dd><dt>来源更新时间</dt><dd>${t.date} <small>（日期精度：天）</small></dd><dt>系统抓取</dt><dd>${t.date} 08:00 UTC <small>（演示时间）</small></dd><dt>实际变化发生</dt><dd>来源未提供</dd></dl></div></div><div class="callout amber">登记状态、阶段和入组数量不能单独证明药物有效性、安全性或监管批准。需结合研究结果与原始资料另行核查。</div></div><div class="stack"><div class="card pad"><h2>观察时间线</h2><div class="timeline mt">${[['09-14','建立基线','首次观察，不是试验启动'],['09-15','重复观察','内容相同，复用原快照'],['09-16','字段发生变化','招募状态 / 目标人数']].map((x,i)=>`<div class="timeline-item ${i===2?'active':''}"><small>${x[0]} · 演示</small><div><strong>${x[1]}</strong></div><p>${x[2]}</p></div>`).join('')}</div><button class="btn link mt" data-nav="changes/EV-01">比较前后观察 ${I('arrow')}</button></div><div class="card pad"><h3>可追溯来源</h3><p class="small mt">虚构标识不会发送给ClinicalTrials.gov。正式版以官方NCT标识构建来源链接。</p>${btn(I('link')+' 打开快照证据','evidence:after',false,'style="margin-top:14px"')}</div></div></div>`;}
function changes(){return pageHeader('变化追踪','以观察链为依据比较登记信息；内容去重，不丢失历史变化。',btn(I('info')+' 如何识别变化','diff-help'))+`<div class="callout amber" style="margin-bottom:18px">下列为 09.14—09.18 的虚构时间线。“建立基线”单独显示，不计入字段变化数。</div><div class="card"><div class="card-head"><h2>观察与变更记录</h2><div class="row">${pill('3 项字段变化','blue')}${pill('1 次建立基线','outline')}</div></div>${changesTable(state.changes)}<div class="table-foot"><span>日期为本系统观察到变化的时间，而非实际临床事件发生时刻。</span></div></div>`;}
function changeDetail(id){const c=state.changes.find(x=>x.id===id)||state.changes[0];const baseline=c.type==='建立基线';const d=diffData();return `<button class="breadcrumb-back" data-nav="changes">← 返回变化追踪</button>`+pageHeader(c.title,`${c.drug} / ${c.trial} · 字段级比较`,btn(I('spark')+' 基于变化发起研究','new-run:'+c.drug,true))+`<div class="grid2"><div class="stack"><div class="card"><div class="card-head"><h2>${baseline?'首次观察':'前后观察对比'}</h2>${pill(c.level,c.level==='信息'?'blue':'amber')}</div>${baseline?'':`<div class="tabs">${[['enrollment','人数变化'],['status','状态变化'],['correction','后续更正'],['reversion','内容回退']].map(([v,l])=>`<button class="tab ${diffMode===v?'active':''}" data-action="diff:${v}">${l}</button>`).join('')}</div>`}<div class="pad">${baseline?'<div class="callout">本条是首次观察，没有之前的内容，不能计算业务变化。</div>':diffPanels()}<div class="callout amber mt">${baseline?c.note:d.note}</div></div></div><div class="card pad"><h3>变化解释与证据</h3><p class="secondary mt">${baseline?'不将基线导入计入已发生变化。':d.explanation}</p>${baseline?'':`<div class="row mt">${btn('查看前值证据','evidence:'+d.kinds[0])}${btn('查看后值证据','evidence:'+d.kinds[1])}</div>`}</div></div><div class="stack"><div class="card pad"><h2>时间与范围</h2><dl class="kv mt"><dt>前次观察</dt><dd>${baseline?'无':d.dates[0]+' 08:00 UTC'}</dd><dt>后次观察</dt><dd>${baseline?'2026-09-17 02:15 UTC':d.dates[1]+' 08:00 UTC'}</dd><dt>发生时间</dt><dd>来源未提供</dd><dt>优先级含义</dt><dd>研究处理优先级，不是临床风险等级</dd></dl></div>${baseline?'':`<div class="card pad"><h3>证据定位</h3><pre class="codebox mt">${d.path}</pre><small>原始字段路径 · 示例快照可定位；正式版保存ID与hash</small></div>`}</div></div>`;}
function diffData(){const path='/protocolSection/designModule/enrollmentInfo/count';const common={path,note:'数字类型仍为 ESTIMATED，不能解释成实际完成入组人数。'};return ({enrollment:{...common,vals:['120','160'],dates:['2026-09-15','2026-09-16'],kinds:['before','after'],explanation:'在两次观察之间，目标人数从120调整为160；S1内容首次出现于09-14，并在09-15重复观察。'},status:{...common,path:'/protocolSection/statusModule/overallStatus',vals:['RECRUITING','ACTIVE_NOT_RECRUITING'],dates:['2026-09-15','2026-09-16'],kinds:['status-before','status'],note:'字段仅描述登记状态，不意味着研究成功或失败。',explanation:'招募状态字段更新；需要其他证据才能讨论疗效、安全性或监管结论。'},correction:{...common,vals:['160','150'],dates:['2026-09-16','2026-09-17'],kinds:['after','correction-after'],note:'来源后续更正；旧报告仍绑定旧快照，不静默改写历史结论。',explanation:'09-17观察到目标人数从160改为150。本切片用于演示更正与版本回溯。'},reversion:{...common,vals:['150','120'],dates:['2026-09-17','2026-09-18'],kinds:['correction-after','reversion-after'],note:'A → B → C → A：复用旧内容快照，但保留新的观察与变化。',explanation:'09-18再次观察到S1内容。新的观察仍然是独立记录，不能按内容hash永久去重变化。'}})[diffMode];}
function diffPanels(){const d=diffData();const statusField=diffMode==='status';return `<div class="diff-grid">${d.vals.map((v,i)=>`<div class="diff-panel"><div class="diff-title row between"><span>${i?'后次观察':'前次观察'} · ${d.dates[i].slice(5)}</span>${pill(i?'AFTER':'BEFORE','outline')}</div><div class="diff-content"><div class="small">${statusField?'overallStatus':'目标入组人数'}</div><div class="${statusField?'mono':'number'}" style="color:${i?'var(--success)':'var(--secondary)'};overflow-wrap:anywhere">${v}${statusField?'':'<span class="small"> 人</span>'}</div>${statusField?'':pill('ESTIMATED','outline')}<pre>${statusField?'"overallStatus": "'+v+'"':'"enrollmentInfo": {\n  "count": '+v+',\n  "type": "ESTIMATED"\n}'}</pre><button class="btn link" style="font-size:11px;margin-top:9px" data-action="evidence:${d.kinds[i]}">${I('link')} 查看原始证据</button></div></div>`).join('')}</div>`;}
function literature(){return pageHeader('文献情报','记录元数据与可获得摘要，保留来源语言及研究范围。',btn(I('search')+' 模拟文献检索','literature-search'))+`<div class="callout" style="margin-bottom:18px">这里展示虚构文献，不使用真实PMID。正式版通过PubMed获取元数据与摘要，不默认抓取全文。</div><div class="card"><div class="filterbar"><input class="input search" id="paper-search" aria-label="筛选文献" placeholder="搜索标题或药物代号…">${pill('3 篇虚构文献','outline')}</div><div id="papers">${[['DEMO-PM-001','PX-101','A fictional protocol update for the PX-101 development program','演示：研究方案更新及登记字段的描述性整理。资料不包含疗效结果。','仅元数据 / 摘要'],['DEMO-PM-002','PX-202','Illustrative study design considerations for PX-202','演示：研究设计说明；不能据此形成安全性或获批判断。','仅元数据 / 摘要'],['DEMO-PM-003','PX-303','A synthetic bibliographic record for interface testing','演示：该条没有可获得摘要。缺失状态应明确展示。','摘要缺失']].map(([id,d,t,p,s])=>`<article class="paper" data-paper="${(d+' '+t).toLowerCase()}"><div class="row wrap" style="margin-bottom:7px">${pill(d,'blue')}${pill(s,s==='摘要缺失'?'amber':'')}<span class="small mono">${id}</span></div><h3>${t}</h3><p>${p}</p><div class="row between"><span class="meta">虚构作者 · 示例期刊 · 2026　|　全部信息仅用于原型</span><button class="btn link" data-action="${id==='DEMO-PM-003'?'missing-abstract':'evidence:'+(id==='DEMO-PM-002'?'paper-002':'paper')}">查看资料 ${I('right')}</button></div></article>`).join('')}</div></div>`;}
const steps=[['确认研究范围','对象、已确认别名、来源和时间窗已冻结'],['检索试验登记','search_trials → 获得关联记录'],['比较前后观察','compare_trial_observations → 识别两个字段变化'],['读取原始证据','read_source_snapshot → 保存前后值定位'],['补查相关文献','search_publications → 判断资料覆盖与缺口'],['核对结论与引用','inspect_evidence → 结构、范围和数值校验'],['提交结构化草稿','submit_research_draft → 进入人工审核']];
function research(id){let r=state.runs.find(x=>x.id===id)||state.runs[0];if(!r){return pageHeader('Agent 研究','让模型基于检索结果决定下一步行动，而不是预设一条固定摘要流水线。',btn(I('plus')+' 新建研究','new-run',true))+`<div class="card hero"><div class="section-label">EVIDENCE-DRIVEN RESEARCH</div><h2>创建第一项研究任务</h2><p class="mt">选择明确的药物、时间范围和来源。本原型展示工具轨迹与状态交互，不会调用真实模型。</p><div class="row wrap mt">${btn(I('play')+' 运行示例研究','demo-run',true)}${btn('先模拟 PubMed 故障','fault-demo')}</div><div class="hero-foot"><span>20 次工具上限</span><span>12 次模型调用上限</span><span>600 秒执行预算</span></div></div>`;}
activeRun=r.id;const runDone=['completed','partial','cancelled'].includes(r.status);const used=r.events.length;return pageHeader('研究执行工作台',r.id+' · 由本地脚本回放，不代表真实模型决策',`<div class="row">${status(r.status)}${r.status==='queued'?btn(I('play')+' 开始回放','start-run',true):r.status==='running'?btn('请求取消','cancel-run'):btn('新建研究','new-run')}</div>`)+`<div class="card pad" style="margin-bottom:18px"><div class="row between wrap"><div><h2>${esc(r.question)}</h2><div class="row wrap" style="margin-top:9px">${pill(r.drug,'blue')}${pill('09.14 — 09.16','outline')}${pill('CT.gov + PubMed','outline')}${pill('REPLAY','purple')}</div></div><div class="small">研究槽 1 / 1<br>模型实际调用：0 次</div></div></div>${r.fault?'<div class="callout amber" style="margin-bottom:16px">已开启故障演示：PubMed工具将返回SOURCE_UNAVAILABLE，结果必须保留资料缺口。</div>':''}<div class="grid2"><div class="stack"><div class="card"><div class="card-head"><h2>行动与工具轨迹</h2><span class="small">不展示隐藏思维链</span></div><div class="pad">${steps.map(([t,d],i)=>`<div class="run-step ${i<r.step?'done':i===r.step&&r.status==='running'?'active':''}"><div class="step-num">${i<r.step?'✓':i+1}</div><div><h3>${t}</h3><p>${i===4&&r.fault&&r.step>4?'SOURCE_UNAVAILABLE · 模拟来源失败，未解释为空结果':d}</p></div></div>`).join('')}</div></div><div class="card pad"><div class="row between"><h3>工具调用记录</h3><span class="small">${used} 条模拟事件</span></div><div class="trace">${r.events.length?r.events.map((e,i)=>`<div class="trace-row"><span class="small">${String(i+1).padStart(2,'0')}</span><span class="mono">${e.tool}</span><span class="status" style="${e.fail?'color:var(--warn)':''}">${e.fail?'来源失败':'已回放'}</span></div>`).join(''):'<div class="trace-row small">尚未执行，点击“开始回放”。</div>'}</div></div></div><div class="stack"><div class="card pad"><h2>执行预算</h2><div class="source-row"><span>模拟工具调用</span><strong>${used} / 20</strong></div><div class="progressbar"><span style="width:${used/20*100}%"></span></div><div class="source-row"><span>实际模型Token</span><strong>0</strong></div><div class="source-row"><span>费用</span><strong>未调用模型</strong></div><small>真实版usage未返回时显示未知，不填0。这里的0来自纯离线回放。</small></div><div class="card pad"><h2>资料覆盖</h2><div class="source-row"><span>ClinicalTrials.gov</span>${pill(r.step>=2?'样例可用':'待回放',r.step>=2?'green':'')}</div><div class="source-row"><span>PubMed</span>${pill(r.step>=5?(r.fault?'来源失败':'样例零结果'):'待回放',r.step>=5?(r.fault?'amber':'blue'):'')}</div><div class="callout mt">${r.fault&&r.step>=5?'PubMed来源未完成核查，不能据此声称没有新增文献。':'仅覆盖当前虚构对象与时间窗，不代表全部研发进展。'}</div></div>${runDone?`<div class="card pad"><h2>${r.status==='cancelled'?'回放已取消':'草稿已就绪'}</h2><p class="secondary small mt">${r.status==='partial'?'试验登记部分完成，文献来源存在缺口，仍需人工核查。':r.status==='cancelled'?'已停止本地定时器，没有后台模型或外部请求。':'结构化结论与证据进入审核流程，未自动发布。'}</p>${r.status!=='cancelled'?`<button class="btn primary mt" data-nav="reports/${r.reportId||'REP-001'}">查看本次演示报告 ${I('arrow')}</button>`:''}</div>`:`<div class="card pad"><h3>为什么需要补查？</h3><p class="small mt">正式版中，工具调用由模型根据证据决定；这里的回放只用于演示页面状态，不验证Agent自主性。</p></div>`}</div></div>`;}
function startRun(){let r=state.runs.find(x=>x.id===activeRun);if(!r||r.status==='running')return;if(state.runs.some(x=>x.id!==r.id&&x.status==='running')){toast('已有研究占用唯一执行槽，请先等待或取消该任务。');return;}r.status='running';r.step=0;r.events=[];save();render();clearInterval(timer);timer=setInterval(()=>{let run=state.runs.find(x=>x.id===r.id);if(!run||run.status!=='running'){clearInterval(timer);return;}const tool=['resolve_drug','search_trials','compare_trial_observations','read_source_snapshot','search_publications','inspect_evidence','submit_research_draft'][run.step];run.events.push({tool,fail:run.step===4&&run.fault});run.step++;if(run.step===steps.length){run.status=run.fault?'partial':'completed';run.reportId='REP-RUN-'+run.id;state.reports.unshift({id:run.reportId,title:run.drug+' 研究回放草稿',drug:run.drug,status:'draft',version:1,date:'09-16 20:00',cutoff:'2026-09-16 12:00 UTC',fault:run.fault});clearInterval(timer);toast(run.fault?'模拟研究部分完成：来源失败已保留为资料缺口。':'模拟研究完成：草稿等待人工审核。');}save();if((location.hash||'').includes('research'))render();},850);}
function reports(){let rs=state.reports.filter(r=>reportTab==='all'||r.status===reportTab);return pageHeader('研究报告与审核','结论、证据与版本绑定。批准后仍需显式发布，修改内容必须重新审核。',btn(I('file')+' 查看示例报告','open-report',true))+`<div class="card"><div class="tabs">${[['all','全部报告'],['in_review','待审核'],['draft','草稿'],['published','已发布']].map(([v,l])=>`<button class="tab ${reportTab===v?'active':''}" data-action="report-tab:${v}">${l}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>报告标题</th><th>研究对象</th><th>状态</th><th>版本</th><th>生成时间</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td><div class="name-cell"><div class="review-marker">${I('file')}</div><div><strong>${esc(r.title)}</strong><small>${r.id} · 虚构资料</small></div></div></td><td>${r.drug}</td><td>${status(r.status)}</td><td class="mono">v${r.version}</td><td class="small">${r.date}</td><td><button class="btn link" data-nav="reports/${r.id}">打开 ${I('right')}</button></td></tr>`).join('')}</tbody></table></div>${rs.length?'':'<div class="empty"><h3>当前没有这一状态的报告</h3></div>'}<div class="table-foot"><span>来源核验与人工审核不等于医学准确性认证。</span></div></div>`;}
function sparseReport(r){const old=r.id==='REP-003';return `<button class="breadcrumb-back" data-nav="reports">← 返回报告列表</button>`+pageHeader('报告范围与资料缺口',r.id+' · v'+r.version,btn(I('download')+' 导出示例 Markdown','export:'+r.id))+`<div class="grid2"><div class="card pad report-body"><div class="row">${pill('DEMO / 虚构资料','blue')}${status(r.status)}</div><h2 class="report-title">${esc(r.title)}</h2><p class="small">对象 ${r.drug} · 截止 ${r.cutoff}</p><div class="divider"></div><h3>资料覆盖</h3><p>${old?'此报告的资料截止时间早于09-16的变化，只能描述已建立基线与重复观察，不能提前引用后续120→160的变化。':'当前对象仅有基线和范围样例，没有注入足够的前后版本及独立证据。不能借用PX-101证据来描述这个药物。'}</p><div class="callout amber mt">${r.fault?'PubMed来源模拟失败，尚未完成核查。':''}资料不足以支持疗效、安全性或监管批准结论。</div></div><div class="card pad"><h2>原型范围</h2><p class="secondary mt">完整的结论—证据审阅流程仅在 PX-101 / REP-001 中演示。本报告用于展示不同研究对象、较早截止时间与资料不足场景。</p><button class="btn primary mt" data-nav="reports/REP-001">打开完整审核示例</button></div></div>`;}
function reportDetail(id){const r=state.reports.find(x=>x.id===id)||state.reports[0];const reviewer=state.role==='reviewer';const self=state.role==='analyst';const partial=!!r.fault;if(r.drug!=='PX-101'||r.id==='REP-003')return sparseReport(r);return `<button class="breadcrumb-back" data-nav="reports">← 返回报告列表</button>`+pageHeader('报告与证据审阅',`${r.id} · v${r.version} · ${r.cutoff}`,btn(I('download')+' 导出示例 Markdown','export:'+r.id))+`<div class="grid2"><div class="stack"><div class="card pad report-body"><div class="row wrap">${pill('DEMO / 虚构资料','blue')}${status(r.status)}${pill('JSON 为正式版权威结构','outline')}</div><h2 class="report-title">${esc(r.title)}</h2><div class="small">研究对象：${r.drug}　|　资料截止：${r.cutoff}<br>本页内容为产品演示，不是实际医药研究报告。</div><div class="divider"></div><h3>执行摘要</h3><p>在本次虚构演示时间窗内，PX-101 关联试验的目标入组人数及招募状态发生登记变化。以下内容仅描述两次观察之间的来源差异。</p><h2>01 · 登记信息变化</h2><p><strong>目标入组人数由 120 调整为 160。</strong>两次记录均标记为 ESTIMATED，因此该变化不应被表述为“已完成入组增加40人”。<button class="cite" data-action="evidence:before">E1</button><button class="cite" data-action="evidence:after">E2</button></p><p>招募状态从 RECRUITING 更新为 ACTIVE_NOT_RECRUITING。这个字段仅说明登记状态，不单独支持试验成功、药物有效或已获批准的结论。<button class="cite" data-action="evidence:status">E3</button></p><h2>02 · 文献覆盖与资料缺口</h2><p>${partial?'本次文献来源请求失败，尚未完成PubMed核查。不能据此声称没有新增文献。':'当前示例范围内没有注入可用于疗效判断的新文献。演示零结果不代表真实世界没有相关文献。'}</p><div class="callout ${partial?'amber':''}">${partial?'部分完成：文献来源不可用。':'范围说明：本原型只使用虚构登记字段与示例摘要。'} 本次资料不足以形成疗效、安全性或监管批准结论。</div><h2>03 · 方法与证据</h2><p>按已确认药物对象查询资料，比较前后观察版本；将数值、状态及原始字段路径绑定到独立证据。报告发布前需要核对当前版本及其证据。</p><div class="divider"></div><div class="row wrap">${pill('2 份前后快照','outline')}${pill('3 条演示证据','outline')}${pill('人工审核必需','purple')}</div></div></div><div class="stack review-column"><div class="card pad"><div class="row between"><h2>结论级证据</h2>${I('shield')}</div><div class="claim-card mt"><div class="row between"><span class="mono">C1</span>${pill('可定位字段','green')}</div><p>目标入组人数 120 → 160；来源类型是 ESTIMATED。</p><div class="row">${btn('E1 前值','evidence:before',false,'style="font-size:12px"')}${btn('E2 后值','evidence:after',false,'style="font-size:12px"')}</div></div><div class="claim-card"><div class="row between"><span class="mono">C2</span>${pill('限制 / 缺口','amber')}</div><p>资料不支持疗效、安全性或监管结论。限制项不应被改写为确定事实。</p></div><small>“可定位”仅指演示证据存在，不是医学认证。</small></div><div class="card pad"><div class="row between"><h2>审核操作</h2>${status(r.status)}</div><dl class="kv mt" style="grid-template-columns:75px 1fr"><dt>版本</dt><dd>v${r.version} · ${r.id}</dd><dt>作者</dt><dd>演示分析员</dd><dt>当前角色</dt><dd>${reviewer?'独立演示审核员':'演示分析员（作者）'}</dd></dl><div class="callout ${self?'amber':''} mt">${self?'作者不能批准自己的报告。请使用右上角“演示审核员”查看审核流程。':'请核对证据与当前版本。此处批准仅改变原型状态，不执行实际后端操作。'}</div>${r.status==='in_review'?`<label class="checkline"><input id="review-confirm" type="checkbox" ${state.reviewed?'checked':''} ${self?'disabled':''}>我已核对当前版本、前后值和研究限制。</label><div class="review-actions"><button class="btn primary" data-action="approve:${r.id}" ${self||!state.reviewed?'disabled':''}>${I('check')} 批准当前版本</button><button class="btn" data-action="reject:${r.id}" ${self?'disabled':''}>要求修改</button></div>`:r.status==='approved'?`<div class="callout green mt">已批准；尚未发布。发布将创建模拟站内通知。</div><button class="btn primary mt" data-action="publish:${r.id}" ${self?'disabled':''}>发布已批准版本</button>`:r.status==='published'?`<div class="callout green mt">已发布到原型工作区。没有发送邮件或访问外部服务。</div>`:`<button class="btn primary mt" data-action="submit-review:${r.id}">提交审核</button>`}</div></div></div>`;}
function subscriptions(){return pageHeader('订阅管理','让登记变化形成周期研究任务；简报仍需人工审核后交付。',btn(I('plus')+' 新建订阅','new-sub',true))+`<div class="grid-even">${state.subscriptions.map(s=>`<div class="card subscription"><div class="title"><div class="row"><div class="stat-icon" style="color:var(--primary)">${I('bell')}</div><h2>${esc(s.name)}</h2></div><button class="toggle ${s.enabled?'on':''}" data-action="toggle-sub:${s.id}" aria-label="${s.enabled?'暂停':'启用'} ${esc(s.name)}" aria-pressed="${s.enabled}"></button></div><div class="row wrap">${pill(s.drug,'blue')}${pill(s.enabled?'已启用':'已暂停',s.enabled?'green':'')}</div><div class="sched"><div class="row between"><span>${I('clock')} ${s.frequency}</span><span class="small">Asia/Shanghai</span></div><small>只冻结下一轮配置；已运行任务不随订阅修改。</small></div><div class="kv" style="grid-template-columns:80px 1fr"><span class="small">资料源</span><span>CT.gov / PubMed</span><span class="small">交付方式</span><span>站内通知 ${pill('邮件未配置','outline')}</span><span class="small">审核方式</span><span>人工批准后发布</span></div><div class="row between mt"><small>原型不会实际定时运行</small><button class="btn" data-action="trigger-sub:${s.id}">${I('play')} 手动演示触发</button></div></div>`).join('')}</div><div class="callout amber mt">无新增且来源完整：不重复生成简报。来源失败：显示缺口，不能推进完整覆盖水位。未知邮件状态不自动重发。</div>`;}

function openModal(title,body,foot=''){lastFocus=document.activeElement;$('#overlays').innerHTML=`<div class="modal-shade" data-action="close"></div><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="btn ghost square" data-action="close" aria-label="关闭对话框">${I('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</section>`;setTimeout(()=>{const host=$('.modal-body');if(!host)return;const f=$('input,textarea,select,button',host)||$('.modal button');f?.focus();},10);}

function evidence(kind){lastFocus=document.activeElement;const e=evidenceData(kind);const paper=kind.startsWith('paper');$('#overlays').innerHTML=`<div class="drawer-shade" data-action="close"></div><section class="drawer" role="dialog" aria-modal="true" aria-label="原始证据"><div class="drawer-head"><div><div class="section-label">EVIDENCE INSPECTOR</div><h2>原始证据与版本</h2></div><button class="btn ghost square" data-action="close" aria-label="关闭证据">${I('close')}</button></div><div class="drawer-body"><div class="row wrap">${pill('DEMO / 虚构','blue')}${pill(paper?'PubMed 样例':'CT.gov 样例','outline')}${pill('来源片段','green')}</div><h2 style="margin-top:18px">${paper?(e.record||'DEMO-PM-001'):'DEMO-CT-001'}</h2><p class="small">${e.drug||'PX-101'} · 仅用于证据定位与交互演示</p><div class="divider"></div><dl class="kv"><dt>证据标识</dt><dd>${e.id}</dd><dt>内容快照</dt><dd>${e.snap}</dd><dt>快照首次出现</dt><dd>${e.first} 08:00 UTC</dd><dt>本次观察</dt><dd>${e.observed} 08:00 UTC</dd><dt>资料用途</dt><dd>登记字段描述，不支持疗效判断</dd></dl><h3 class="mt">原始片段</h3><div id="evidence-quote" class="codebox mt" style="font-size:${paper?'13':'23'}px">${esc(e.quote)}</div><h3 class="mt">定位路径</h3><pre class="codebox">${e.path}</pre>${paper?'':`<h3 class="mt">上下文</h3><pre class="codebox">${e.path.endsWith('overallStatus')?'"overallStatus": "'+e.quote+'"':'"enrollmentInfo": {\n  "count": '+e.quote+',\n  "type": "ESTIMATED"\n}'}</pre>`}<div class="callout amber mt">${paper?'这是虚构摘要，不存在真实PMID或论文全文。':e.path.endsWith('overallStatus')?'仅能说明登记状态；不支持试验成败或药物有效性判断。':'ESTIMATED表示登记目标值，不应写成实际已入组人数。'}</div><div class="divider"></div><small>正式版保存snapshot ID、内容hash和定位；本原型中的短ID为显示别名，不替代contracts/中的UUID。</small><div class="row mt">${btn('复制片段','copy:'+kind)}${btn('关闭证据','close')}</div></div></section>`;setTimeout(()=>$('.drawer button')?.focus(),10);}
function evidenceData(kind){const count='/protocolSection/designModule/enrollmentInfo/count',status='/protocolSection/statusModule/overallStatus';return ({before:{id:'E1',quote:'120',snap:'S1',first:'2026-09-14',observed:'2026-09-15',path:count},after:{id:'E2',quote:'160',snap:'S2',first:'2026-09-16',observed:'2026-09-16',path:count},status:{id:'E3',quote:'ACTIVE_NOT_RECRUITING',snap:'S2',first:'2026-09-16',observed:'2026-09-16',path:status},'status-before':{id:'E-STATUS-BEFORE',quote:'RECRUITING',snap:'S1',first:'2026-09-14',observed:'2026-09-15',path:status},'correction-after':{id:'E-CORRECTION',quote:'150',snap:'S3',first:'2026-09-17',observed:'2026-09-17',path:count},'reversion-after':{id:'E-REVERSION',quote:'120',snap:'S1（内容复用）',first:'2026-09-14',observed:'2026-09-18',path:count},'paper-002':{id:'E-PAPER-002',record:'DEMO-PM-002',drug:'PX-202',quote:'This fictional PX-202 study design abstract is provided for interface testing only. It contains no clinical outcome evidence.',snap:'P2',first:'2026-09-16',observed:'2026-09-16',path:'/abstract'},paper:{id:'E-PAPER',quote:'This synthetic abstract describes a fictional protocol record. It provides no evidence of efficacy or safety.',snap:'P1',first:'2026-09-16',observed:'2026-09-16',path:'/abstract'}})[kind]||{id:'UNKNOWN',quote:'缺失',snap:'无',first:'未知',observed:'未知',path:'不可定位'};}
function newRun(drug='PX-101'){openModal('创建研究任务',`<div class="callout" style="margin-bottom:18px">本次仅创建本地回放任务，不调用外部模型或数据源。</div><div class="form-field"><label for="run-q">研究问题 *</label><textarea id="run-q" class="input" maxlength="4000">整理 ${esc(drug)} 的临床试验登记变化，列出前后证据，并说明文献覆盖与资料缺口。</textarea><small>10—4,000字符；不输入患者、诊断或用药信息。</small></div><div class="form-grid"><div class="form-field"><label for="run-drug">研究药物</label><select class="input" id="run-drug">${state.drugs.map(d=>`<option ${d.id===drug?'selected':''}>${d.id}</option>`).join('')}</select></div><div class="form-field"><label>研究时间范围</label><input class="input" value="09.14 — 09.16 · 固定演示窗口" readonly></div></div><div class="row wrap">${pill('ClinicalTrials.gov','blue')}${pill('PubMed','blue')}${pill('工具上限 20','outline')}</div><label class="checkline"><input id="run-fault" type="checkbox" ${state.fault?'checked':''}>本次模拟 PubMed 来源失败（验证 partial）</label>`,btn('取消','close')+btn('创建回放任务','create-run',true));}
function downloadReport(id){const r=state.reports.find(x=>x.id===id)||state.reports[0];const standard=r.drug==='PX-101'&&r.id!=='REP-003';let body=standard?'## 登记变化\n\nDEMO-CT-001 目标入组人数从120调整为160，均为ESTIMATED，不等于已完成入组。\n\n## 证据\n\nE1：虚构快照S1，/protocolSection/designModule/enrollmentInfo/count = 120。\nE2：虚构快照S2，同路径值 = 160。':'## 资料范围\n\n本报告仅含基线或资料缺口，不引用其他对象及截止时间之后的变化。';let text=`# ${r.title}\n\n> DEMO：全部资料为虚构；原型导出，未调用模型。\n\n- 对象：${r.drug}\n- 版本：v${r.version}\n- 状态：${stLabel[r.status]}\n- 资料截止：${r.cutoff}\n\n${body}\n\n## 限制\n\n${r.fault?'PubMed来源未完成核查，不能视为无结果。\n':''}不支持疗效、安全性或监管批准结论。\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download='PharmaScope_Lite_'+r.id+'_DEMO.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出明确标识为DEMO的Markdown示例。');}

case'missing-abstract':openModal('DEMO-PM-003 · 摘要缺失',`<div class="callout amber">PX-303 · 该条虚构记录只有元数据，没有可获得摘要。不能补造摘要或创建摘要证据。</div><p class="small mt">这不是来源请求失败，而是单条记录缺少字段。不会展示其他药物的文献内容。</p>`,btn('关闭','close',true));break;
case'literature-search':$('#paper-search')?.focus();toast('在输入框中筛选当前虚构文献，不执行真实检索。');break;
case'reset':openModal('重置演示数据',`<p>清除当前浏览器新增的药物、订阅、任务与审核状态，恢复初始虚构样例。</p>`,btn('取消','close')+btn('确认重置','confirm-reset',true));break;
case'confirm-reset':clearInterval(timer);state=JSON.parse(JSON.stringify(seed));save();closeOverlay();route='dashboard';location.hash='dashboard';render();toast('已恢复初始演示数据。');break;
}});
document.addEventListener('change',e=>{if(e.target.id==='role-select'){state.role=e.target.value;state.reviewed=false;save();render();toast('已切换演示角色；正式权限必须由后端验证。');}if(e.target.id==='scene'){state.scenario=e.target.value;render();}if(e.target.id==='status-filter'){tableStatus=e.target.value;render();}if(e.target.id==='review-confirm'){state.reviewed=e.target.checked;render();}});
let filterTimer;document.addEventListener('input',e=>{if(e.target.id==='table-search'){let pos=e.target.selectionStart;filter=e.target.value;clearTimeout(filterTimer);filterTimer=setTimeout(()=>{render();let f=$('#table-search');f?.focus();f?.setSelectionRange(pos,pos);},180);}if(e.target.id==='paper-search'){let q=e.target.value.toLowerCase();$$('[data-paper]').forEach(p=>p.classList.toggle('hidden',!p.dataset.paper.includes(q)));}});
document.addEventListener('keydown',e=>{if(e.target.id==='global-search'&&e.key==='Enter'){pendingSearch=e.target.value;filter=pendingSearch;state.scenario='normal';if(location.hash==='#drugs'){pendingSearch=null;render();}else nav('drugs');}if(e.key==='Escape'){closeOverlay();$('#sidebar').classList.remove('open');}if(e.key==='Tab'&&$('.modal,.drawer')){const dialog=$('.modal,.drawer');const fs=$$('button:not([disabled]),input:not([disabled]),textarea,select,a[href]',dialog).filter(x=>x.offsetParent!==null);if(!fs.length)return;const first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{filter=pendingSearch??'';pendingSearch=null;tableStatus='all';diffMode=location.hash.endsWith('EV-02')?'status':location.hash.endsWith('EV-04')?'correction':'enrollment';state.reviewed=false;state.scenario='normal';render();window.scrollTo(0,0);});
// A persisted "running" replay cannot continue after a closed browser; reset it honestly.
state.runs.forEach(r=>{if(r.status==='running')r.status='queued';});render();
</script></body></html>
